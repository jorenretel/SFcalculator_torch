[workspace]
name = "sfcalculator-torch"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", { name = "gpu-linux", platform = "linux-64", cuda = "12.8" }]

[dependencies]
python = "3.12.*"
numpy = ">=1.26,<2"
pandas = ">=2.2.2,<=2.2.3"

[pypi-dependencies]
sfcalculator-torch = { path = ".", editable = true, extras = ["test"] }

[feature.cpu]
platforms = ["linux-64", "osx-arm64"]

[feature.cpu.dependencies]
pytorch-cpu = ">=2.6,<3"

[feature.gpu]
platforms = ["gpu-linux"]

[feature.gpu.dependencies]
pytorch-gpu = ">=2.6,<3"
cuda-version = "12.8.*"

[tasks]
test = "python -m pytest"
test-reference = "python -m pytest -o addopts= -q tests/test_fprotein_reference.py tests/test_fprotein_streaming.py tests/test_fprotein_benchmark.py"
benchmark = "python -m benchmarks.fprotein"

[environments]
default = { features = ["cpu"] }
gpu = { features = ["gpu"] }
